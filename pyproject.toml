[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vd3d"
version = "0.1.0"
description = "Vertical decomposition of an arrangement of planes in 3D"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[project.scripts]
vd3d = "vd3d.cli:main"

[tool.setuptools.packages.find]
include = ["vd3d*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "visual: writes inspectable figures under artifacts/visual/",
]
